<!doctype html><html lang="ja" data-lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELI5 pages</title>
<style>
:root{--bg:#fffaf3;--ink:#222;--sub:#666;--box:#fff;--accent:#e07a1f;--line:#c9b9a6}
:root[data-theme="dark"]{--bg:#16171b;--ink:#eee;--sub:#aaa;--box:#24262c;--accent:#ffa552;--line:#555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:80px 18px 60px}
.bar{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:9}
.bar button{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--box);color:var(--ink);cursor:pointer}
h1{font-size:28px;margin:0 0 18px}
[lang="ja"]{word-break:keep-all;overflow-wrap:anywhere}
html[data-lang="ja"] span[lang="en"],html[data-lang="en"] span[lang="ja"]{display:none}
html[data-lang="both"] span[lang="en"]{display:block;font-size:.8em;color:var(--sub)}
.card{display:block;background:var(--box);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;color:var(--ink);text-decoration:none;max-width:100%}
.card:hover{border-color:var(--accent)}.card h3{margin:0 0 6px;font-size:19px;color:var(--accent)}.card p{margin:0;font-size:15px}
</style></head><body>
<div class="bar"><button data-setlang="ja" onclick="setLang('ja',true)">JA</button><button data-setlang="en" onclick="setLang('en',true)">EN</button><button data-setlang="both" onclick="setLang('both',true)">Both</button><button onclick="setTheme('light')">Light</button><button onclick="setTheme('dark')">Dark</button></div>
<main><h1><span lang="ja">かんたん解説ページ</span><span lang="en">ELI5 pages</span></h1>
<a class="card" href="grok-bot-201/"><h3><span lang="ja">Grok Bot 201</span><span lang="en">Grok Bot 201</span></h3><p><span lang="ja">AIボットのチームでシール屋さんを作った話（約55分を15場面で）。</span><span lang="en">A team of AI bots builds a sticker shop (55 min in 15 scenes).</span></p></a>
<a class="card" href="grok-bot-marketing/"><h3><span lang="ja">マーケ用 Grok Bot</span><span lang="en">Grok Bot for Marketing</span></h3><p><span lang="ja">担当ボットのチームで、イベントを企画から集客まで（約1時間を15場面で）。</span><span lang="en">A team of bots runs an event from idea to launch (1 hour in 15 scenes).</span></p></a>
</main>
<script>
window.setLang=function(m,save){var d=document.documentElement;d.dataset.lang=m;d.lang=m==='en'?'en':'ja';if(save)try{localStorage.setItem('eli5-lang',m)}catch(e){}};
window.setTheme=function(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('eli5-theme',t)}catch(e){}};
(function(){var ok=function(v){return v==='ja'||v==='en'||v==='both'};var q=new URLSearchParams(location.search).get('lang'),s=null;try{s=localStorage.getItem('eli5-lang')}catch(e){}
 setLang(ok(q)?q:ok(s)?s:(/^ja/i.test(navigator.language||'')?'ja':'en'))})();
var th=null;try{th=localStorage.getItem('eli5-theme')}catch(e){}
setTheme(th||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
</script></body></html>
